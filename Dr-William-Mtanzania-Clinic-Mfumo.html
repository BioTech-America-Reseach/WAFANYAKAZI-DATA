*{

}

html{
  scroll-behavior:smooth
}

body{
  margin:0;

  color:var(--ink);

}

.font-display{
  font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif
}

.card{
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:20px;
  box-shadow:0 10px 30px rgba(15,23,42,.07)
}

.gold-border{
  border:2px solid var(--gold)!important;
  box-shadow:0 0 0 4px rgba(245,158,11,.18),0 14px 34px rgba(245,158,11,.18)
}

@keyframes pulseGold{
  0%,100%{
    box-shadow:0 0 0 3px rgba(245,158,11,.22)
  }

  50%{
    box-shadow:0 0 0 7px rgba(245,158,11,.08)
  }
}

.pulse-gold{
  animation:pulseGold 1.6s ease-in-out infinite
}

@keyframes flashRed{
  0%,100%{
    background:#DC2626;
    color:white
  }

  50%{
    background:#7F1D1D;
    color:#FEE2E2
  }
}

.flash-red{
  animation:flashRed .9s infinite
}

@keyframes slideUp{
  from{
    opacity:0;
    transform:translateY(10px)
  }

  to{
    opacity:1;
    transform:translateY(0)
  }
}

.slide-up{
  animation:slideUp .35s ease both
}

  font:inherit
}

input:focus,select:focus,textarea:focus{
  outline:2px solid var(--teal);

}

}
